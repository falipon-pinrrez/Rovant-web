<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Rovant - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <!-- Logo Rovant -->
        <img src="../Iconos/Rovant.png" alt="Rovant" class="logo-rovant">

        <!-- Usuario -->
        <label class="label-usuario" for="usuario">Usuario</label>
        <input type="text" id="usuario" class="input-usuario" placeholder="" autocomplete="username">

        <!-- Contraseña -->
        <label class="label-password" for="password">Contraseña</label>
        <input type="password" id="password" class="input-password" placeholder="" autocomplete="current-password">

        <!-- Botón Iniciar Sesión -->
        <button class="btn-login" type="button" id="btnLogin">Iniciar sesión</button>

        <!-- Imágenes decorativas -->
        <img src="../Iconos/Login1.png" alt="" class="img-login1">
        <img src="../Iconos/Login2.png" alt="" class="img-login2">
    </div>

    <script src="script.js"></script>
</body>
</html>
